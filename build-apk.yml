name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Ayusin ang pagkakalagay ng files (flat o may folder, parehong gumagana)
        run: |
          mkdir -p www scripts native/java native/res/drawable
          [ -f index.html ] && mv index.html www/index.html || true
          [ -f patch_android.py ] && mv patch_android.py scripts/patch_android.py || true
          [ -f MainActivity.java ] && mv MainActivity.java native/java/ || true
          [ -f TcpSocketPlugin.java ] && mv TcpSocketPlugin.java native/java/ || true
          [ -f ic_stat_icon.xml ] && mv ic_stat_icon.xml native/res/drawable/ || true
          [ -f lame.min.js ] && mv lame.min.js www/lame.min.js || true
          test -f www/index.html || { echo "::error::Walang index.html"; exit 1; }
          ls -R www scripts native

      - name: Install dependencies
        run: npm install

      - name: Use lame.min.js (MP3 encoder)
        run: |
          if [ ! -f www/lame.min.js ]; then
            if [ -f node_modules/lamejs/lame.min.js ]; then
              cp node_modules/lamejs/lame.min.js www/lame.min.js
            else
              curl -fL -o www/lame.min.js https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.0/lame.min.js || echo "::warning::Walang lame.min.js: hindi gagana ang GO LIVE. I-upload ang sarili mong lame.min.js."
            fi
          fi
          ls -la www

      - name: Patch index.html para sa Capacitor plugins (TcpSocket, ForegroundService)
        run: python3 scripts/patch_web.py

      - name: Compat Android 9+ (polyfill, syntax)
        run: python3 scripts/patch_compat.py

      - name: Create Android project
        run: npx cap add android

      - name: Patch Android (manifest, plugins, icon)
        run: python3 scripts/patch_android.py

      - name: Ensure native plugins (TcpSocket, ForegroundService)
        run: python3 ensure_tcp.py

      - name: Android 15+ edge-to-edge opt-out
        run: python3 scripts/patch_edge.py

      - name: Lock landscape (sensorLandscape)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q screenOrientation "$M" || sed -i '0,/<activity/s//<activity android:screenOrientation="sensorLandscape"/' "$M"
          grep -n "screenOrientation" "$M"

      - name: Install app icon (logo)
        run: |
          pip install pillow
          python3 scripts/make_icons.py

      - name: Sync web files
        run: npx cap sync android

      - name: Verify (laman ng APK)
        run: |
          echo "== Java files =="
          find android/app/src -name "*.java"
          echo "== registerPlugin =="
          grep -rn "registerPlugin" android/app/src/main/java || { echo "::error::Walang registerPlugin"; exit 1; }
          echo "== Manifest =="
          grep -n "GrooveService\|FOREGROUND\|RECORD_AUDIO" android/app/src/main/AndroidManifest.xml || true

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk THE-GROOVE-MIXER.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: THE-GROOVE-MIXER-apk
          path: THE-GROOVE-MIXER.apk

      - name: Publish APK to Releases (direct .apk download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "The Groove Mixer APK #${{ github.run_number }}"
          files: THE-GROOVE-MIXER.apk
